# From the Genesis factory template. The pinned Genesis commit must be on GitHub before this runs.
# The check rebuilds every applet with the Genesis commit its release record names and fails
# unless the rebuild equals the committed published/ build.
name: Genesis check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    uses: nirvanacp/genesis/.github/workflows/applet-check.yml@655ce128bce13bd8a376a3630766fb18182ba928
    with:
      genesis-ref: 655ce128bce13bd8a376a3630766fb18182ba928
