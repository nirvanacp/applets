# From the Let factory template. The pinned Let commit must be on GitHub before this runs.
# PLACEHOLDER: replace <let-sha> with the full sha of a nirvanacp/let commit on GitHub that has
# .github/workflows/applet-check.yml, once that branch is pushed.
# The check installs the tools with npm ci from the committed package-lock.json, rebuilds every
# applet with the tools and Node versions its release record names, and fails unless the rebuild
# equals the committed published/ build.
name: Genesis check

# Disabled until CI is set up for this repository: runs only when started by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: nirvanacp/let/.github/workflows/applet-check.yml@<let-sha>
    # hn-bookmarks and x-bookmarks have local services built from these servelets, with this Go.
    with:
      servelets-repository: nirvanacp/servelets
      servelets-ref: 3160240a988b42c52e0a5e0a0becf3a91d091924
      go-version: 1.26.2
